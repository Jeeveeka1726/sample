<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="form-container">
  <h2>Registration Form</h2>
  <form>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>
    <div class="form-group">
      <label for="mobile">Mobile number</label>
      <input type="tel" id="mobile" placeholder="Enter your mobile number" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="department">Department</label>
      <select id="department" required>
        <option value="">Choose your department</option>
        <option value="mechanical">Mechanical</option>
        <option value="computer-science">Computer Science</option>
        <option value="electrical">Electrical</option>
      </select>
    </div>
    <div class="form-group">
      <label>Do you like to receive updates via WhatsApp?</label>
      <label><input type="radio" name="whatsapp" value="yes"> Yes</label>
      <label><input type="radio" name="whatsapp" value="no"> No</label>
    </div>
    <div class="buttons">
      <button type="reset" class="save-btn">Reset</button>
      <button type="submit" class="submit-btn">Submit</button>
    </div>
  </form>
</div>

</body>
</html>
